<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="1.5" opacity="0.35"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Monitor Bezel -->
  <rect x="0" y="0" width="800" height="600" fill="#0b0f19"/>
  <rect x="20" y="20" width="760" height="560" rx="10" fill="url(#screenBg)" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="46" fill="#0d1829" stroke="#00f0ff" stroke-opacity="0.2"/>
  <circle cx="45" cy="43" r="6" fill="#ef4444"/>
  <circle cx="65" cy="43" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="43" r="6" fill="#10b981"/>
  <text x="110" y="48" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="13" font-weight="600">NEXA-CORE DATAVAULT // SECURE TERMINAL #WS-CEO-01</text>
  <text x="640" y="48" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="12" filter="url(#glow)">● LIVE LINK</text>

  <!-- Red Security Alert Box -->
  <rect x="40" y="90" width="720" height="85" rx="6" fill="url(#alertGrad)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="125" fill="#ef4444" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" filter="url(#glow)">⚠ SECURITY BREACH: UNAUTHORIZED USB EXTRACTION</text>
  <text x="65" y="155" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="14">EVENT TIMESTAMP: 2026-09-14 23:52:10.884 WIB | PORT: USB-REAR-04</text>

  <!-- Terminal Code Log Body -->
  <g font-family="'Fira Code', monospace" font-size="13" fill="#38bdf8">
    <text x="40" y="220" fill="#64748b">[23:50:04] AUTH_GATEWAY: Keycard proximity scan accepted.</text>
    <text x="40" y="245" fill="#64748b">[23:50:11] DOOR_SENSOR: Penthouse Rear Vault Hatch UNLOCKED.</text>
    <text x="40" y="270" fill="#cbd5e1">[23:51:40] PHYSICAL_DETECT: High-speed NVMe flash controller mounted.</text>
    <text x="40" y="295" fill="#f59e0b">[23:52:00] ACCESS_REQUEST: Master_Encryption_Key_2026.bin (Access Level 4 Required)</text>
    <text x="40" y="320" fill="#00f0ff">[23:52:05] OVERRIDE_PIN: Verified via Executive Security Bypass Token.</text>
    <text x="40" y="345" fill="#ef4444" font-weight="bold">[23:52:10] CRITICAL: 4,096-bit Master Key Copied to Volume 'BLACK_BOX_D'.</text>
    <text x="40" y="370" fill="#64748b">[23:52:45] DEVICE_EJECT: USB bus unmounted unexpectedly.</text>
    <text x="40" y="395" fill="#64748b">[23:53:01] INTRUSION_LOG: Terminal session closed without sign-off.</text>
  </g>

  <!-- Hex Dump Visuals -->
  <g font-family="'Fira Code', monospace" font-size="11" fill="#475569">
    <text x="40" y="450">0x00007FFF: 4E 45 58 41 2D 53 45 43  55 52 49 54 59 2D 4B 45  | NEXA-SECURITY-KE</text>
    <text x="40" y="470">0x0000800F: 59 2D 4D 41 53 54 45 52  38 38 31 39 2D 54 48 4F  | Y-MASTER8819-THO</text>
    <text x="40" y="490">0x0000801F: 52 4E 45 2D 56 41 55 4C  54 2D 42 52 45 41 43 48  | RNE-VAULT-BREACH</text>
  </g>

  <!-- Evidence Tag Stamp -->
  <rect x="580" y="430" width="180" height="120" rx="8" fill="#111c33" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="465" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">FORENSIC ITEM [C]</text>
  <text x="600" y="490" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="11">TYPE: Digital Log</text>
  <text x="600" y="510" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="11">RACK: CEO-VAULT-01</text>
  <text x="600" y="530" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="11">STATUS: SECURED</text>

  <!-- Scanline Filter Overlay -->
  <rect x="20" y="20" width="760" height="560" fill="url(#scanlines)" pointer-events="none"/>
</svg>
