<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgDavid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="skinDavid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b196"/>
      <stop offset="100%" stop-color="#c98a68"/>
    </linearGradient>
  </defs>
  <!-- Background with Police Measurement Grid -->
  <rect x="0" y="0" width="400" height="500" fill="url(#bgDavid)"/>
  <line x1="0" y1="100" x2="400" y2="100" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="360" y="105" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">6'1"</text>
  <text x="360" y="155" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">5'10"</text>
  <text x="360" y="205" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">5'7"</text>

  <!-- Body / Security Uniform -->
  <path d="M 90 500 L 130 310 L 270 310 L 310 500 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="175,310 200,380 225,310" fill="#cbd5e1"/>
  <polygon points="195,340 205,340 210,460 190,460" fill="#0284c7"/>
  <!-- Security Badge -->
  <rect x="135" y="360" width="30" height="20" rx="3" fill="#f59e0b"/>
  <text x="140" y="374" fill="#000" font-family="'Fira Code', monospace" font-size="9" font-weight="bold">SEC</text>

  <!-- Head & Face -->
  <rect x="180" y="250" width="40" height="60" fill="#c98a68"/>
  <ellipse cx="200" cy="200" rx="60" ry="75" fill="url(#skinDavid)"/>
  <!-- Hair: Short Military Cut -->
  <path d="M 140 180 Q 200 110 260 180 Q 240 130 200 130 Q 160 130 140 180 Z" fill="#1e293b"/>
  <!-- Eyes & Eyebrows (Stern, calculating look) -->
  <path d="M 160 180 Q 175 175 190 182" stroke="#0f172a" stroke-width="3" fill="none"/>
  <path d="M 210 182 Q 225 175 240 180" stroke="#0f172a" stroke-width="3" fill="none"/>
  <ellipse cx="175" cy="192" rx="6" ry="4" fill="#0f172a"/>
  <ellipse cx="225" cy="192" rx="6" ry="4" fill="#0f172a"/>
  <!-- Nose & Mouth -->
  <path d="M 200 190 L 196 220 L 206 220" stroke="#9a5a3a" stroke-width="2.5" fill="none"/>
  <line x1="185" y1="242" x2="215" y2="242" stroke="#7a3a20" stroke-width="2.5"/>
  <!-- Stubble / Jaw Shadow -->
  <path d="M 155 215 Q 200 280 245 215" stroke="#9a5a3a" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>

  <!-- Plaque Bar -->
  <rect x="50" y="430" width="300" height="55" rx="6" fill="#030712" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="200" y="455" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">DAVID THORNE</text>
  <text x="200" y="475" text-anchor="middle" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="11">VP OF SECURITY // ID: NEXA-8819</text>
</svg>
