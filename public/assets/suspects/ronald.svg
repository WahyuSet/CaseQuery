  <path d="M 90 500 L 130 320 L 270 320 L 310 500 Z" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="175,320 200,390 225,320" fill="#ffffff"/>
  <polygon points="195,350 205,350 212,470 188,470" fill="#f59e0b"/>

