  </defs>
  <rect x="0" y="0" width="400" height="500" fill="url(#bgRonald)"/>
  <line x1="0" y1="100" x2="400" y2="100" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="360" y="105" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">6'2"</text>

