  <ellipse cx="200" cy="205" rx="56" ry="68" fill="url(#skinRonald)"/>
  <path d="M 135 185 Q 170 115 200 120 Q 230 115 265 185 Q 240 140 200 140 Q 160 140 135 185 Z" fill="#94a3b8"/>

  <!-- Features -->
  <path d="M 165 188 Q 180 182 192 186" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M 208 186 Q 220 182 235 188" stroke="#334155" stroke-width="2.5" fill="none"/>
  <circle cx="178" cy="196" r="4" fill="#0f172a"/>
  <circle cx="222" cy="196" r="4" fill="#0f172a"/>
  <path d="M 188 245 Q 200 248 212 245" stroke="#78350f" stroke-width="2" fill="none"/>

  <!-- Deceased / Crime Victim Banner -->
  <rect x="50" y="430" width="300" height="55" rx="6" fill="#1c1917" stroke="#ef4444" stroke-width="1.5"/>
  <text x="200" y="455" text-anchor="middle" fill="#ef4444" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">RONALD STERLING [DECEASED]</text>
