      <stop offset="0%" stop-color="#1e1814"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    <linearGradient id="skinRonald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf9c"/>
      <stop offset="100%" stop-color="#cf9f7a"/>
